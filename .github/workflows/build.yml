name: build-image

on:
  schedule:
    - cron: "20 4 * * *" # daily, picks up new Silverblue base + RPM Fusion updates
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FEDORA_VERSION: "45"
  IMAGE_DESC: "Fedora Silverblue + RPM Fusion media & gaming addons"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Prepare names and tags
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          NAME="${GITHUB_REPOSITORY#*/}"
          NAME="${NAME,,}"
          DATE="$(date -u +%Y%m%d)"
          echo "registry=ghcr.io/${OWNER}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/${NAME}" >> "$GITHUB_OUTPUT"
          echo "tags=latest ${FEDORA_VERSION} ${FEDORA_VERSION}-${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          sudo podman build \
            --pull=always \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            --build-arg IMAGE_REGISTRY="${{ steps.meta.outputs.registry }}" \
            --build-arg IMAGE_NAME="${{ steps.meta.outputs.name }}" \
            --label org.opencontainers.image.title="${{ steps.meta.outputs.name }}" \
            --label org.opencontainers.image.description="${IMAGE_DESC}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.version="${FEDORA_VERSION}.$(date -u +%Y%m%d)" \
            --label containers.bootc=1 \
            --tag "${{ steps.meta.outputs.image }}:build" \
            -f Containerfile .

      # Repack the image into layers grouped by package (like Fedora's base),
      # so updates only download what changed. --previous-build keeps the
      # layer layout stable between daily builds. 1Password, which rpm no
      # longer owns after the move, gets its own layer via the
      # user.component xattr (see 25-1password.sh).
      - name: Rechunk image
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            --entrypoint /usr/bin/rpm-ostree "${IMAGE}:build" \
            compose build-chunked-oci --bootc --format-version=1 --max-layers 128 \
            --previous-build "docker://${IMAGE}:latest" \
            --from "${IMAGE}:build" \
            --output "containers-storage:${IMAGE}:chunked"
          sudo podman rmi "${IMAGE}:build"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        # GHCR sporadically rejects blob uploads ("unauthenticated: User
        # cannot be authenticated with the token provided"), so log in again
        # and retry. Layers that already made it are skipped on the retry.
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          for tag in ${{ steps.meta.outputs.tags }}; do
            sudo podman tag "${IMAGE}:chunked" "${IMAGE}:${tag}"
            for attempt in 1 2 3; do
              sudo podman push --digestfile /tmp/digest "${IMAGE}:${tag}" && break
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Pushing ${tag} failed 3 times"; exit 1
              fi
              echo "::warning::Push of ${tag} failed (attempt ${attempt}), retrying in 30s"
              sleep 30
              echo "${{ secrets.GITHUB_TOKEN }}" | \
                sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            done
          done
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::error::SIGNING_SECRET is not set - see README"; exit 1
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
